name: Pipeline DevOps

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validar:
    name: Validar código
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar index.html
        run: test -f index.html

      - name: Verificar etiqueta HTML
        run: grep -q "<html>" index.html

      - name: Verificar título
        run: grep -q "<h1>" index.html

  docker:
    name: Construir y probar Docker
    runs-on: ubuntu-latest
    needs: validar

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t mi-proyecto-devops:latest .

      - name: Ejecutar contenedor
        run: docker run -d -p 8080:80 --name mi-proyecto-web mi-proyecto-devops:latest

      - name: Probar aplicación
        run: curl --fail http://localhost:8080
